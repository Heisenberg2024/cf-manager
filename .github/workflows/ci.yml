name: CI

# 自动 CI 检查：针对 master 的 PR 自动触发，编译/类型检查/单元测试校验三部分代码，
# 任一失败则该 PR 的状态检查变红，配合分支规则集（protect-master）阻止合并。
# 三个 job 的 status check context 分别为：build-backend / build-frontend / build-worker
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Cache backend node_modules
        id: cache-backend
        uses: actions/cache@v5
        with:
          path: backend/node_modules
          key: backend-node-${{ hashFiles('backend/package-lock.json') }}
      - name: Install backend dependencies
        if: steps.cache-backend.outputs.cache-hit != 'true'
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
      - name: Lint backend
        working-directory: backend
        run: npm run lint
      - name: Test backend
        working-directory: backend
        run: npm run test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cache frontend node_modules
        id: cache-frontend
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: frontend-node-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        if: steps.cache-frontend.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npx vite build
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        run: npm run test

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Cache worker node_modules
        id: cache-worker
        uses: actions/cache@v5
        with:
          path: worker/node_modules
          key: worker-node-${{ hashFiles('worker/package-lock.json') }}
      - name: Install worker dependencies
        if: steps.cache-worker.outputs.cache-hit != 'true'
        working-directory: worker
        run: npm ci
      # 生成被 .gitignore 的构建期文件（version.ts / shared 数据 / catalog 校验器），
      # 供 typecheck 与 esbuild 使用。不再调用 build.js —— 它会在 CI 里重复安装并构建
      # 整个 frontend（frontend 已由 build-frontend job 独立校验），重复导致 14 分钟级延迟。
      - name: Prepare generated files (version + shared sync)
        working-directory: worker
        run: |
          node ../scripts/gen-version.js worker
          node ../scripts/sync-shared.js
      - name: Build worker (esbuild bundle only)
        working-directory: worker
        run: |
          mkdir -p public
          npm run build:worker
      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck
      - name: Lint worker
        working-directory: worker
        run: npm run lint
      - name: Test worker
        working-directory: worker
        run: npm run test

  schema-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify backend/worker DB schema alignment
        run: node scripts/check-db-schema.mjs
